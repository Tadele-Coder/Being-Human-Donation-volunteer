{% extends 'app/base.html' %}
{% load static %}

{% block main %}
<section class="vh-100 gradient-custom">
    <div class="container py-5 h-100">
        <div class="row justify-content-center align-items-center h-100">
            <div class="col-md-6">
                <div class="card bg-dark text-white text-center p-5" style="border-radius:20px;">

                    <i class="bi bi-check-circle-fill text-success" style="font-size:90px;"></i>

                    <h2 class="mt-4">Password Reset Complete</h2>

                    <p class="mt-3">
                        Your password has been reset successfully.
                        You can now log in using your new password.
                    </p>

                    <a href="{% url 'login_admin' %}" class="btn btn-success mt-3">
                        Login
                    </a>

                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
